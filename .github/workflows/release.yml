name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      self_contained:
        description: 'Gerar versão autocontida (Self-Contained)?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validar Versão do SDK
        run: dotnet --version

      - name: Executar Script de Release
        shell: pwsh
        run: |
          # Determina a versão semântica a partir da tag Git ou do input manual
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
            $selfContained = [System.Convert]::ToBoolean("${{ github.event.inputs.self_contained }}")
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^v', ''
            $selfContained = $false
          }

          Write-Host "Iniciando geração de release para a versão: $ver (SelfContained=$selfContained)"

          if ($selfContained) {
            .\build-release.ps1 -Version $ver -SelfContained
          } else {
            .\build-release.ps1 -Version $ver
          }

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
